# Fly.io ayarı. Önce:  fly volume create vefa_data --size 1 --region fra
app = "vefa-auto-CHANGE-ME"
primary_region = "fra"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "3000"

[mounts]
  source = "vefa_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
