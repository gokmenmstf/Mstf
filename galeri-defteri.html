<title>Vefa Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   VEFA AUTO · "Aurora" tasarımı — sıfırdan yazılmış tek stil dosyası
   Marka renkleri: lacivert + kırmızı. Açık / koyu tema, cam efekti kartlar.
   ===================================================================== */
:root{
  --bg:#f6f2f8; --surface:#ffffff; --surface2:#eee8f3; --ink:#1e1f40; --muted:#5d5f85; --line:#e5deec;
  --plate:#974063; --plate-ink:#ffffff; --signal:#a4421f; --signal-bg:#ffe9e0;
  --ok:#0b8a57; --ok-bg:#d9f5e8; --bad:#d3202f; --bad-bg:#fde7e9; --info-bg:#f3e4ec; --scrim:rgba(7,11,32,.55);
  --plate-bg:#ffffff; --plate-line:#1e1f40;
  --b2:#ff8a63; --accent:#F54768; --accent-ink:#ffffff;
  --grad:linear-gradient(135deg,#FF9677 0%,#F54768 50%,#974063 100%);
  --grad-blue:linear-gradient(135deg,#c0577f 0%,#974063 50%,#41436A 100%);
  --grad-gold:linear-gradient(135deg,#ffb59c 0%,#FF9677 100%);
  --side:#33355a; --side-ink:#c3c2e2;
  --hero-bg:linear-gradient(125deg,#2f3157 0%,#41436A 32%,#974063 78%,#d9506a 128%);
  --hero-ink:#fff; --hero-mute:rgba(255,255,255,.74);
  --hero-shadow:0 30px 70px -30px rgba(65,67,106,.8);
  --vph-bg:linear-gradient(165deg,#ece6f5 0%,#f6f1f9 55%,#fcf9fd 100%);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(30,31,64,.05),0 14px 36px -18px rgba(65,67,106,.30);
  --shadow-lg:0 26px 60px -24px rgba(65,67,106,.45);
  --r:20px;
  --f-display:'Sora','Plus Jakarta Sans',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#14152a; --surface:#1d1f3d; --surface2:#272a50; --ink:#f7f0f6; --muted:#aaa9cc; --line:#363963;
  --plate:#FF9677; --plate-ink:#14152a; --signal:#ffa88c; --signal-bg:#4a2a36;
  --ok:#4fd8a0; --ok-bg:#0e3a2b; --bad:#ff8b95; --bad-bg:#44202a; --info-bg:#3b2a4d; --scrim:rgba(0,0,0,.7);
  --plate-bg:#f6f4f9; --plate-line:#14152a;
  --b2:#FF9677; --accent:#FF9677;
  --side:#0e0f22; --side-ink:#aaa9cc;
  --hero-bg:linear-gradient(125deg,#15162e 0%,#41436A 52%,#8a3a5c 112%);
  --hero-shadow:0 30px 70px -26px rgba(0,0,0,.7);
  --vph-bg:linear-gradient(165deg,#34376a 0%,#262850 60%,#1b1c3a 100%);
  --glass:rgba(29,31,61,.72); --glass-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -20px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){color-scheme:dark}}

/* ---------- temel ---------- */
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(90px)}
body::before{width:52vmax;height:52vmax;left:-18vmax;top:-22vmax;background:rgba(245,71,104,.18);animation:drift1 30s ease-in-out infinite alternate}
body::after{width:44vmax;height:44vmax;right:-14vmax;bottom:-18vmax;background:rgba(255,150,119,.20);animation:drift2 36s ease-in-out infinite alternate}
:root[data-theme="dark"] body::before{background:rgba(245,71,104,.18)}
:root[data-theme="dark"] body::after{background:rgba(255,150,119,.12)}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vmax,-8vmax) scale(1.2)}}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:30px;line-height:1.12;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:650}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .pos{color:var(--ok)} .neg{color:var(--bad)}
.pre{font-family:var(--f-mono);font-size:12px}
.sr:not(.modal-back),.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:rgba(245,71,104,.25)}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);background-clip:padding-box}
:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

/* ---------- yerleşim ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%;gap:0}
.main{padding:30px 38px 72px;min-width:0;max-width:1260px;width:100%}

/* ---------- yan menü (yüzen cam panel) ---------- */
.side{position:sticky;top:14px;align-self:start;height:calc(100vh - 28px);margin:14px 0 14px 14px;overflow:auto;
  padding:20px 14px 16px;border-radius:26px;color:var(--side-ink);display:flex;flex-direction:column;
  background:radial-gradient(120% 40% at 0% 0%,rgba(255,150,119,.30),transparent 65%),radial-gradient(90% 30% at 100% 100%,rgba(255,150,119,.18),transparent 70%),var(--side);
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,.06) inset}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:2px 6px 18px}
.brand .logo{display:block;width:150px;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
.brand small{display:block;color:var(--side-ink);font-size:11.5px;letter-spacing:.04em}
.srbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;margin-bottom:14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--side-ink);transition:background .2s,color .2s}
.srbtn:hover{background:rgba(255,255,255,.13);color:#fff}
.srbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.srbtn span{flex:1}
kbd{font:500 11px var(--f-mono);padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.1);color:inherit;border:1px solid rgba(255,255,255,.14)}
nav{display:flex;flex-direction:column;gap:3px}
nav button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:14px;color:var(--side-ink);font-weight:600;transition:background .2s,color .2s,transform .2s}
nav button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button span.t{flex:1;min-width:0}
nav button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(3px)}
nav button[aria-current="page"]{background:var(--grad);color:#fff;box-shadow:0 12px 26px -10px rgba(245,71,104,.8);transform:none}
nav button:focus-visible{outline:2px solid #fff}
nav .cnt{font:700 11px var(--f-mono);background:#FF9677;color:#3a1210;padding:1px 8px;border-radius:10px}
nav button[aria-current="page"] .cnt{background:#fff;color:#974063}
.tsw{all:unset;box-sizing:border-box;cursor:pointer;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 13px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--side-ink);width:100%;font-size:13px;font-weight:600}
.tsw:hover{color:#fff;border-color:rgba(255,255,255,.35)}
.tsw:focus-visible{outline:2px solid #fff;outline-offset:2px}
.trk{position:relative;flex:none;width:62px;height:30px;border-radius:20px;background:linear-gradient(90deg,#7dd3fc,#bae6fd);transition:background .35s;box-shadow:inset 0 1px 3px rgba(0,0,0,.25);overflow:hidden}
.tsw[aria-checked="true"] .trk{background:linear-gradient(90deg,#1e1b4b,#312e81)}
.tsw svg{position:absolute;top:6px;width:18px;height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;z-index:3}
.tsw .i-sun{left:7px;stroke:#b45309}.tsw .i-moon{right:7px;stroke:#c7d2fe}
.knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.5,1.4,.5,1);z-index:2}
.tsw[aria-checked="true"] .knob{transform:translateX(32px);background:#e0e7ff}
.themebtn{display:none!important}
html.tr *,html.tr *::before,html.tr *::after{transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s!important}

/* ---------- başlık ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--muted)}
.hwrap{display:flex;align-items:center;gap:15px}
.pico{flex:none;width:52px;height:52px;border-radius:18px;background:var(--grad);display:grid;place-items:center;box-shadow:0 14px 26px -10px rgba(245,71,104,.7),0 0 0 1px rgba(255,255,255,.25) inset}
.pico svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- düğmeler ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 17px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:650;color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 1px 2px rgba(30,31,64,.05);transition:transform .15s,box-shadow .2s,border-color .2s,filter .2s}
.btn:hover{border-color:var(--plate);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.btn.primary{background:var(--grad);background-size:160% 100%;border-color:transparent;color:#fff;box-shadow:0 12px 24px -10px rgba(245,71,104,.75);transition:background-position .45s,transform .15s,box-shadow .2s}
.btn.primary:hover{background-position:100% 0;border-color:transparent;box-shadow:0 16px 30px -10px rgba(245,71,104,.85)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:11px}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c4a);border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px rgba(18,140,74,.8)}
.btn.wa:hover{filter:brightness(1.07)}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu[open]>summary{border-color:var(--plate)}
.menu-p{position:absolute;right:0;top:calc(100% + 8px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:190px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.menu-p button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:600}
.menu-p button:hover,.menu-p button:focus-visible{background:var(--surface2)}
.menu-p .danger{color:var(--bad)}
.lnk{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;color:var(--plate);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--plate) 40%,transparent);text-underline-offset:3px;font-weight:600}
.lnk:hover{text-decoration-color:var(--plate)}
.lnk:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.lnk .plaka{text-decoration:none}

/* ---------- kartlar ---------- */
.card,.kpi,.rpt-doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card{padding:22px;transition:box-shadow .25s,border-color .25s}
.card:hover{border-color:color-mix(in srgb,var(--plate) 28%,var(--line));box-shadow:var(--shadow-lg)}
.card+.card,.stack>*+*{margin-top:18px}
.grid2>.card+.card{margin-top:0}
.card>h3{display:flex;align-items:center;gap:10px}
.card>h3:first-child::before{content:"";width:5px;height:18px;border-radius:4px;background:var(--grad);flex:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid2{display:grid;gap:18px;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr))}
.kpi{position:relative;overflow:hidden;padding:16px 18px;transition:transform .25s,box-shadow .25s}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad-blue)}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.kpi small{color:var(--muted);display:block;font-size:12px;font-weight:600}
.kpi b{font-family:var(--f-display);font-size:23px;font-weight:700;display:block;margin-top:3px;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi b span{font-size:inherit;color:inherit;font-weight:inherit}
.kpi span{font-size:12px;color:var(--muted)}
.sub{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;margin-top:4px}
.sub b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.more{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.more summary{cursor:pointer;font-weight:650;color:var(--plate)}
.cost{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cost:last-child{border-bottom:0}
.cost.tot{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:9px}
.live{background:var(--surface2);border:1px dashed color-mix(in srgb,var(--plate) 40%,var(--line));border-radius:14px;padding:11px 14px;font-size:13px}
.live div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.live div span{color:var(--muted)}
.live div b{font-family:var(--f-mono);font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;background:var(--surface2);border-left:4px solid var(--line);margin-top:9px}
.alert.warn{border-left-color:#FF9677;background:var(--signal-bg)}
.alert.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.alert.info{border-left-color:var(--plate);background:var(--info-bg)}
.banner{border-radius:16px;padding:10px 16px;margin-bottom:16px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.banner b{color:var(--ink)}
.paidnote{background:var(--ok-bg);border-radius:14px;padding:11px 14px}
.bar{height:9px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399)}
.pbar{height:12px;border-radius:8px;background:var(--surface2);margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#10b981,#34d399);box-shadow:0 0 14px rgba(16,185,129,.5)}
.pct{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--plate);font-family:var(--f-display)}
.empty-s{text-align:center;padding:38px 20px;color:var(--muted)}
.empty-s .carart{width:200px;max-width:70%;height:auto;display:block;margin:0 auto 10px;opacity:.9;animation:bob 3.2s ease-in-out infinite}
.empty-s p{margin:0}
@keyframes bob{50%{transform:translateY(-6px)}}
.tip{display:flex;align-items:center;gap:13px;padding:13px 17px;margin:-4px 0 18px;border-radius:18px;background:linear-gradient(90deg,color-mix(in srgb,#FF9677 20%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,#FF9677 36%,var(--line));font-size:13.5px}
.tip i{flex:none;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#ffb59c,#ff7f5a);display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(255,154,31,.9)}
.tip svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- özet (hero) ---------- */
.hero{background:var(--hero-bg);background-size:200% 200%;animation:heroShift 20s ease-in-out infinite alternate;color:var(--hero-ink);border-radius:30px;padding:30px 32px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--hero-shadow),0 0 0 1px rgba(255,255,255,.1) inset}
@keyframes heroShift{from{background-position:0 0}to{background-position:100% 100%}}
.hero::before{content:"";position:absolute;background:#ffe08a;width:76px;height:76px;left:calc(32% + var(--p,.5)*22%);top:calc(var(--sy,26px) + 8px);transition:left 2s,top 2s;border-radius:50%;box-shadow:0 0 0 14px rgba(255,224,138,.2),0 0 80px 40px rgba(255,214,102,.42)}
.hero::after{content:"";position:absolute;left:34%;bottom:-140px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
:root[data-theme="dark"] .hero::before{background:transparent;width:54px;height:54px;left:calc(32% + var(--p,.5)*22%);right:auto;top:calc(var(--sy,26px) + 10px);box-shadow:-14px 8px 0 0 #f6f2da}
:root[data-theme="dark"] .hero::after{left:auto;bottom:auto;width:3px;height:3px;right:310px;top:26px;background:#fff;box-shadow:60px 30px 0 #fff,-120px 14px 0 rgba(255,255,255,.7),120px -6px 0 rgba(255,255,255,.6),-40px 70px 0 rgba(255,255,255,.5),160px 80px 0 rgba(255,255,255,.8),-200px 60px 0 rgba(255,255,255,.5),20px 96px 0 rgba(255,255,255,.6)}
.hero>*{position:relative;z-index:1}
.hero small{color:var(--hero-mute);font-size:13px;display:block}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:54px;line-height:1.02;letter-spacing:-.035em;margin:8px 0 6px;overflow-wrap:anywhere}
.hero .big em{font-style:normal;color:#FF9677}
.hero .hl{color:var(--hero-mute);font-size:13px}
.hero .pos{color:#9ff0c4}.hero .neg{color:#ffc2c2}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:14px 22px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.2)}
.hstats div small{font-size:12px}
.hstats div b{font-family:var(--f-display);font-weight:700;font-size:20px;display:block;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
.hs2>div{display:grid;grid-template-columns:40px 1fr;column-gap:12px;align-items:center}
.hs2 .hi{grid-row:1/3;width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.hi svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28);box-shadow:none}
.hero .btn:hover{border-color:#fff}
.hero .btn.primary{background:#fff;color:#974063;border-color:transparent;box-shadow:0 10px 22px -8px rgba(0,0,0,.4)}
.hero .badge{background:rgba(255,255,255,.18);color:#fff}
.hero .badge.ok{color:#ffe4da}.hero .badge.warn{color:#fde68a}.hero .badge.bad{color:#fecaca}
.hero.bk{display:block}
.hero.bk .bkh .big{font-size:46px}
.bkph{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--hero-mute);cursor:pointer}
.spark{position:absolute;right:30px;top:26px;width:min(30%,300px);z-index:1}
.spark small{display:block;text-align:right;margin-bottom:2px}
.spark svg{width:100%;height:74px;display:block}

/* ---------- hızlı işlemler ---------- */
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px;margin-bottom:18px}
.qa button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:13px;padding:17px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-weight:700;box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s}
.qa button:hover{transform:translateY(-4px);border-color:var(--plate);box-shadow:var(--shadow-lg)}
.qa button:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.qa i{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;box-shadow:0 10px 18px -8px rgba(30,31,64,.5)}
.qa i svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qa .c1{background:linear-gradient(135deg,#ff9677,#f54768)}.qa .c2{background:linear-gradient(135deg,#b5527f,#974063)}.qa .c3{background:linear-gradient(135deg,#ffb08c,#ff7f5a)}
.qa .c4{background:linear-gradient(135deg,#ff7a6b,#d11a48)}.qa .c5{background:linear-gradient(135deg,#6a6dae,#41436A)}.qa .c6{background:linear-gradient(135deg,#7886a8,#3a4468)}

/* ---------- tablo ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-size:11px;font-weight:700;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 40%,transparent)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--plate) 9%,var(--surface))}
tr.click:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.paid td{background:var(--ok-bg)!important}
tr.paid .badge.ok{background:var(--surface)}
.tw td:last-child:not(.r){white-space:normal}
.tw td:last-child:not(.r) .btn,.tw td:last-child:not(.r) .lnk{margin:2px 4px 2px 0}
.badge{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:650;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;opacity:.9}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--signal-bg);color:var(--signal)} .badge.info{background:var(--info-bg);color:var(--plate)}
.plaka{display:inline-flex;align-items:stretch;border:2px solid var(--plate-line);border-radius:6px;background:var(--plate-bg);color:#111;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;box-shadow:0 3px 8px -2px rgba(30,31,64,.3)}
.plaka i{font-style:normal;background:#41436A;color:#fff;font-size:8px;padding:0 4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:1px}
.plaka span{padding:2px 7px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;margin-right:8px;vertical-align:middle;font:700 10px var(--f-body);font-style:normal;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 72% 58%),hsl(calc(var(--h) + 40) 72% 42%));text-decoration:none;box-shadow:0 4px 8px -3px rgba(30,31,64,.45)}
.th{width:46px;height:34px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px;border:1px solid var(--line)}

/* ---------- form ---------- */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 13px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--plate) 40%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--plate);box-shadow:0 0 0 4px color-mix(in srgb,var(--plate) 22%,transparent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.search{max-width:290px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;color:var(--muted);font-weight:650}
.fld small{color:var(--muted);font-size:11px}
.fld.chk{flex-direction:row;align-items:center;gap:9px;padding-top:20px}
.fld.chk label{color:var(--ink);font-size:13px}
.sec{grid-column:1/-1;font-family:var(--f-display);font-size:15px;font-weight:700;border-bottom:1px solid var(--line);padding:8px 0 6px}
.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;transition:border-color .15s,transform .15s}
.chip:hover{border-color:var(--plate);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 16px -8px rgba(245,71,104,.8)}
.chips.seg{gap:0;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:4px;display:inline-flex}
.chips.seg .chip{border:0;background:transparent;border-radius:12px;padding:7px 17px}
.chips.seg .chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 3px 8px rgba(30,31,64,.16)}

/* ---------- modal, arama, alt sayfa ---------- */
.modal-back{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;z-index:50;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--surface);border-radius:26px;border:1px solid var(--line);width:100%;max-width:780px;padding:26px;margin:auto 0;box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.modal.sm{max-width:450px}
.modal h2{margin-bottom:16px}
.modal .foot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.modal-back.sr{align-items:flex-start;padding:12vh 12px 12px}
.srbox{width:100%;max-width:600px;margin:0 auto;background:var(--surface);border-radius:24px;border:1px solid var(--line);box-shadow:0 40px 90px rgba(15,16,40,.55);overflow:hidden;animation:pop .25s ease}
.srin{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line);color:var(--muted)}
.srin input{all:unset;flex:1;min-width:0;font-size:17px;color:var(--ink)}
.srin kbd{background:var(--surface2);border-color:var(--line);color:var(--muted)}
.srres{max-height:52vh;overflow:auto;padding:9px}
.sri{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border-radius:14px}
.sri[aria-selected="true"],.sri:hover{background:var(--surface2)}
.sri .tg{flex:none;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--info-bg);color:var(--plate)}
.sri .tg::before{display:none}
.sri .sl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sri .ss{font-size:12px}
.modal-back.sheet{align-items:flex-end;padding:0}
.sheetbox{width:100%;max-width:580px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:sheetUp .25s ease}
.sheetbox h2{margin-bottom:14px}
.sheetbox .qa{margin:0;grid-template-columns:repeat(3,minmax(0,1fr))}
@keyframes sheetUp{from{transform:translateY(50px);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;z-index:80;max-width:90%;font-weight:600;box-shadow:var(--shadow-lg)}
.fab{display:none}
.fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}

/* ---------- araç kartları ---------- */
.vgrid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(275px,1fr))}
.vcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s,box-shadow .25s;will-change:transform}
.vcard:hover{transform:translateY(-5px);border-color:var(--plate);box-shadow:var(--shadow-lg)}
.vcard:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.vcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
.vcard.s-stokta::after{background:var(--grad-blue)}
.vcard.s-rezerve::after,.vcard.s-opsiyon::after{background:linear-gradient(90deg,#ffb59c,#FF9677)}
.vcard.s-satildi::after{background:linear-gradient(90deg,#10b981,#34d399)}
.vph{aspect-ratio:16/10;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(70% 80% at 50% 85%,color-mix(in srgb,var(--c,#94a3c4) 40%,transparent),transparent 72%),var(--vph-bg)}
.vph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,transparent,rgba(30,31,64,.09));pointer-events:none}
.vph>*{position:relative;z-index:1}
.vph img{width:100%;height:100%;object-fit:cover;display:block}
.vph>img{position:absolute;inset:0;z-index:0}
.vph .carart{width:80%;max-width:330px;height:auto;margin-bottom:18px;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.vcard:hover .carart{transform:translateX(6px) scale(1.04)}
.vph>.pl{position:absolute;bottom:13px;left:50%;transform:translateX(-50%)}
.vph .pl .plaka{font-size:14px}
.vph .plaka{font-size:20px;border-width:3px;border-radius:7px}
.vph .st{position:absolute;left:12px;top:12px;z-index:2}
.vph .st .badge{background:var(--surface);color:var(--ink);box-shadow:0 4px 12px rgba(30,31,64,.2)}
.vph .st .badge::before{display:none}
.vph .st .badge.warn{background:#FF9677;color:#3a1210}
.vb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.vb h3{font-size:18px;line-height:1.15;font-weight:700}
.vb .muted{font-size:12px}
.vp{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.vp small{display:block;color:var(--muted);font-size:11px}
.vp b{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.vcard .gun{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:20px;padding:1px 9px}
.vhero{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);margin-bottom:18px;box-shadow:var(--shadow-lg)}
.vhero .vph{aspect-ratio:auto;min-height:270px}
.vhero .vph .carart{max-width:390px}
.vhero .vi{padding:26px 28px;display:flex;flex-direction:column;gap:9px;min-width:0}
.vhero h1{font-size:30px}
.vhero .hl{color:var(--muted)}
.vhero .hstats{margin-top:auto;border-color:var(--line)}
.vhero .hstats b.acc{color:var(--accent)}
.vhero .hstats div small{color:var(--muted)}
.strip{display:flex;gap:9px;overflow-x:auto;padding-bottom:5px}
.pz{all:unset;cursor:pointer;flex:none;width:124px;height:92px;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-sizing:border-box;transition:transform .2s}
.pz:hover{transform:scale(1.04)}
.pz:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.pz img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- vade / uyarı satırları ---------- */
.odl{margin-top:8px}
.odr{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 0;border-top:1px solid rgba(211,32,47,.2)}
.odi{min-width:0;flex:1 1 180px}
.odi .muted{font-size:12px}
.odk{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.odk>span{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.odk b{font-size:15px}

/* ---------- grafik, halka, liste ---------- */
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .b1{fill:url(#gb1)}.chart .b2{fill:url(#gb2)}
.chart rect{transition:opacity .15s}.chart rect:hover{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:7px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.goal{display:flex;gap:22px;align-items:center}
.ring{position:relative;width:106px;height:106px;flex:none}
.ring svg{width:100%;height:100%}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px var(--f-display);letter-spacing:-.02em;line-height:1}
.ring b small{font-size:13px;color:var(--muted);font-weight:500;margin-left:1px}
.dn{display:flex;gap:22px;align-items:center}
.dn .ring b{font-size:28px}
.dn>div:last-child{flex:1;min-width:0}
.lg{display:flex;flex-direction:column;gap:7px;margin-top:8px;font-size:13px;color:var(--muted)}
.lg span{display:flex;align-items:center;gap:8px}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg b{margin-left:auto;color:var(--ink);font-family:var(--f-mono);font-weight:600;min-width:20px;text-align:right}
.sl-list{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.sl-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:13px;padding:9px;border-radius:16px;width:100%;transition:background .15s}
.sl-row:hover{background:var(--surface2)}
.sl-row:focus-visible{outline:2px solid var(--plate)}
.mini{flex:none;width:78px;height:56px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(80% 90% at 50% 85%,color-mix(in srgb,var(--c) 40%,transparent),transparent 75%),var(--vph-bg)}
.mini .carart{width:84%;height:auto}
.sl-t{flex:1;min-width:0;display:flex;flex-direction:column}
.sl-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-row>.num{font-size:14px;font-weight:700;white-space:nowrap}

/* ---------- kutlama + konfeti ---------- */
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.cf i{position:absolute;top:-20px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.modal-back.cele{align-items:center;justify-content:center;padding:16px}
.celebox{width:100%;max-width:410px;text-align:center;color:#fff;border-radius:32px;padding:32px 26px 28px;background:radial-gradient(90% 60% at 50% 0%,rgba(255,255,255,.24),transparent 70%),var(--hero-bg);box-shadow:0 40px 90px rgba(50,30,80,.65);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.celebox h2{font-size:30px;margin:6px 0 2px;color:#fff}
.celebox p{margin:0;color:rgba(255,255,255,.8)}
.cele-art .carart{width:78%;height:auto;animation:drive .8s cubic-bezier(.2,.9,.3,1) both}
.cele-p{font-family:var(--f-display);font-size:42px;font-weight:700;letter-spacing:-.04em;margin:14px 0 18px}
.celebox .btn.primary{background:#fff;color:#974063;box-shadow:0 12px 24px -8px rgba(0,0,0,.4)}
@keyframes drive{from{transform:translateX(-130%) skewX(-12deg)}}

/* ---------- sayfa geçişi ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
#main.in>*{animation:fadeUp .42s ease both}
#main.in>*:nth-child(2){animation-delay:.04s}#main.in>*:nth-child(3){animation-delay:.08s}#main.in>*:nth-child(4){animation-delay:.12s}#main.in>*:nth-child(5){animation-delay:.16s}
#main.in .vgrid .vcard{animation:fadeUp .5s ease both}
#main.in .vgrid .vcard:nth-child(2){animation-delay:.08s}#main.in .vgrid .vcard:nth-child(3){animation-delay:.13s}#main.in .vgrid .vcard:nth-child(4){animation-delay:.18s}
#main.in .vgrid .vcard:nth-child(5){animation-delay:.22s}#main.in .vgrid .vcard:nth-child(6){animation-delay:.27s}#main.in .vgrid .vcard:nth-child(n+7){animation-delay:.32s}

/* ---------- rapor belgesi ---------- */
.rpt-doc{--p-ink:#13172a;--p-mute:#5d6578;--p-line:#eadfee;--p-zebra:#faf6fa;--p-acc:#F54768;background:#fff;color:var(--p-ink);padding:0;overflow:hidden;border-radius:24px}
.rpt-band{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;padding:24px 30px;color:#fff;background:linear-gradient(120deg,#2f3157 0%,#41436A 42%,#974063 100%);position:relative}
.rpt-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#FF9677,#F54768,#974063)}
.rpt-brand{display:flex;align-items:center;gap:14px}
.rpt-brand b{display:block;font:700 19px/1.2 var(--f-display)}
.rpt-brand small{display:block;opacity:.8;font-size:12px;margin-top:2px}
.rpt-logo{display:inline-grid;place-items:center;background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.rpt-logo img{height:54px;width:auto;display:block}
.rpt-band .rpt-meta{text-align:right;color:rgba(255,255,255,.85);font:12px/1.5 var(--f-mono)}
.rpt-meta b{display:block;color:#fff;font-size:14px;font-weight:600;letter-spacing:.03em}
.rpt-body{padding:26px 30px 28px}
.rpt-title h2{font-size:30px;font-weight:700;letter-spacing:-.025em;color:var(--p-ink)}
.rpt-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.rpt-chip{font-size:12px;padding:3px 12px;border-radius:20px;background:#f3e4ec;color:#974063;font-weight:600}
.rpt-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:20px}
.rpt-sum>div{border:1px solid var(--p-line);border-left:4px solid var(--p-acc);border-radius:13px;padding:11px 15px;background:#fff}
.rpt-sum small{display:block;color:var(--p-mute);font-size:11.5px}
.rpt-sum b{display:block;font:700 19px var(--f-display);letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.rtw{overflow-x:auto}
.rpt-doc .rtw{border:1px solid var(--p-line);border-radius:14px}
.rpt{width:100%;border-collapse:collapse;font-size:12.5px}
.rpt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#3a4058;text-align:left;padding:10px 11px;background:#f1eaf3;border-bottom:2px solid var(--p-acc);white-space:nowrap}
.rpt th.r,.rpt td.r{text-align:right}
.rpt td{padding:8px 11px;border-bottom:1px solid var(--p-line);vertical-align:top;color:var(--p-ink);background:transparent}
.rpt td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rpt .nw{white-space:nowrap}
.rpt-doc .rpt tbody tr:nth-child(even) td{background:var(--p-zebra)}
.rpt-doc .rpt tr.g td{background:#f6e6ee!important;color:#974063;font-weight:700;border-left:4px solid var(--p-acc);border-bottom:1px solid #e8c9d7}
.rpt-doc .rpt tr.ara td{background:#f1f2f8!important;font-weight:600}
.rpt-doc .rpt tr.tot td{background:#2e3058!important;color:#fff;font-weight:700;border:0;font-size:13px}
.rpt-doc .rpt tr:last-child td{border-bottom:0}
.rpt tr.tot td:first-child,.rpt tr.ara td:first-child{white-space:nowrap}
.rpt-doc .badge{background:#eef0f6;color:#3a4058}
.rpt-doc .badge.ok{background:#dcf7ea;color:#0b8a57}.rpt-doc .badge.bad{background:#fee9e9;color:#c62828}.rpt-doc .badge.warn{background:#ffe9e0;color:#a4421f}.rpt-doc .badge.info{background:#f3e4ec;color:#974063}
.rpt-doc .pos{color:#0b8a57}.rpt-doc .neg{color:#c62828}.rpt-doc .muted{color:var(--p-mute)}
.rpt-doc .rpt tr.tot .pos,.rpt-doc .rpt tr.tot .neg{color:#fff}
.rpt-sign{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:44px}
.rpt-sign div{border-top:1px solid #9aa0ae;padding-top:6px;font-size:12px;color:var(--p-mute)}
.rpt-foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px;padding-top:10px;border-top:1px solid var(--p-line);font-size:11px;color:var(--p-mute)}
.rpt-filt,.rpt-sub{color:var(--p-mute)}

/* ---------- kayan yer tutucular ---------- */

/* =====================================================================
   EFEKTLER & HAREKET
   ===================================================================== */
/* gün içi renk tonu (data-tod: sabah / gun / aksam / gece) */
:root[data-tod="sabah"]{--hero-bg:linear-gradient(125deg,#41436A 0%,#974063 50%,#FF9677 130%)}
:root[data-tod="aksam"]{--hero-bg:linear-gradient(125deg,#2a2b52 0%,#974063 55%,#F54768 135%)}
:root[data-tod="aksam"][data-theme="dark"]{--hero-bg:linear-gradient(125deg,#1a1a38 0%,#6d2f4d 55%,#c23a56 140%)}
:root[data-tod="sabah"][data-theme="dark"]{--hero-bg:linear-gradient(125deg,#1c1d3c 0%,#5b3556 55%,#c27355 140%)}
/* üçüncü aurora lekesi + ince nokta ağı */
body{background-image:radial-gradient(rgba(65,67,106,.07) 1px,transparent 1.2px);background-size:26px 26px}
:root[data-theme="dark"] body{background-image:radial-gradient(rgba(255,150,119,.07) 1px,transparent 1.2px)}
.app::before{content:"";position:fixed;z-index:-1;left:42vw;top:30vh;width:34vmax;height:34vmax;border-radius:50%;background:rgba(151,64,99,.20);filter:blur(100px);pointer-events:none;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift3{to{transform:translate(-22vmax,18vmax) scale(.8)}}
/* imleci izleyen ışık (kartlar) */
.card,.kpi,.qa button,.vcard,.sl-row{--mx:50%;--my:50%;position:relative}
.card::after,.kpi::after,.qa button::after,.vcard .vb::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,150,119,.20),transparent 62%)}
.card:hover::after,.kpi:hover::after,.qa button:hover::after,.vcard:hover .vb::after{opacity:1}
.vcard .vb{position:relative}
.vcard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 60%)}
.vcard:hover::before{opacity:1}
.hero{--mx:50%;--my:50%}
.hero>.fxglow{display:none}
/* hero: kayan ışık süpürmesi + yüzen baloncuklar */
.hero{background-image:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.14),transparent 38%),var(--hero-bg)}
.hero .big{background:linear-gradient(100deg,#fff 30%,#ffd9cb 50%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}
.hero .hi{animation:floaty 5s ease-in-out infinite}
.hs2>div:nth-child(2) .hi{animation-delay:-1s}.hs2>div:nth-child(3) .hi{animation-delay:-2s}.hs2>div:nth-child(4) .hi{animation-delay:-3s}.hs2>div:nth-child(5) .hi{animation-delay:-4s}
@keyframes floaty{50%{transform:translateY(-4px) rotate(-4deg)}}
.hero::after{animation:orb 14s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(-80px,-30px) scale(1.25)}}
:root[data-theme="dark"] .hero::after{animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
.hero::before{animation:sunpulse 5s ease-in-out infinite}
@keyframes sunpulse{50%{filter:brightness(1.12) saturate(1.1);transform:scale(1.07)}}
/* logo */
.brand .logo{animation:logoFloat 6s ease-in-out infinite}
@keyframes logoFloat{50%{transform:translateY(-3px)}}
/* menü */
nav button svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button:hover svg{transform:scale(1.2) rotate(-6deg)}
nav button[aria-current="page"]{background-size:200% 100%;animation:navGlow 3.2s ease-in-out infinite}
@keyframes navGlow{50%{box-shadow:0 14px 34px -8px rgba(245,71,104,.95)}}
nav .cnt{animation:cntPulse 2.4s ease-in-out infinite}
@keyframes cntPulse{50%{transform:scale(1.14)}}
/* düğmeler: ışık süpürmesi + dalga */
.btn{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.rp{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:ripple .65s ease-out forwards;pointer-events:none}
.chip .rip,.btn:not(.primary):not(.wa) .rip,.qa button .rip{background:rgba(245,71,104,.28)}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.fab{animation:fabPulse 2.6s ease-in-out infinite}
@keyframes fabPulse{0%{box-shadow:0 16px 30px -8px rgba(245,71,104,.7),0 0 0 0 rgba(255,150,119,.5)}70%,100%{box-shadow:0 16px 30px -8px rgba(245,71,104,.7),0 0 0 18px rgba(255,150,119,0)}}
/* hızlı işlem ikonları */
.qa i{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.qa button:hover i{transform:translateY(-3px) rotate(-8deg) scale(1.1)}
.pico{animation:icoBob 4.5s ease-in-out infinite}
@keyframes icoBob{50%{transform:translateY(-3px) rotate(-3deg)}}
.head h1{background:linear-gradient(100deg,var(--ink) 0%,var(--plate) 45%,var(--ink) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleFlow 9s ease-in-out infinite alternate}
@keyframes titleFlow{to{background-position:100% 0}}
.tip i{animation:floaty 4s ease-in-out infinite}
/* uyarılar */
.alert.bad{animation:alertGlow 3s ease-in-out infinite}
@keyframes alertGlow{50%{box-shadow:0 0 0 4px rgba(211,32,47,.10)}}
.badge.bad::before{animation:dot 1.6s ease-in-out infinite}
@keyframes dot{50%{transform:scale(1.7);opacity:.45}}
/* araç kartları */
.vcard .carart{animation:idle 5s ease-in-out infinite}
.vcard:nth-child(even) .carart{animation-delay:-2.5s}
@keyframes idle{50%{transform:translateX(3px)}}
.vcard:hover .carart{animation:none}
.vcard .badge{transition:transform .2s}.vcard:hover .badge{transform:scale(1.06)}
.vcard::after{background-size:200% 100%;animation:barFlow 5s linear infinite}
@keyframes barFlow{to{background-position:200% 0}}
.plaka{transition:transform .25s}.vcard:hover .plaka{transform:scale(1.06)}
/* tablo satırları kademeli giriş */
#main.in tbody tr{animation:fadeUp .4s ease both}
#main.in tbody tr:nth-child(2){animation-delay:.04s}#main.in tbody tr:nth-child(3){animation-delay:.08s}#main.in tbody tr:nth-child(4){animation-delay:.12s}#main.in tbody tr:nth-child(5){animation-delay:.16s}#main.in tbody tr:nth-child(n+6){animation-delay:.2s}
#main.in .kpi{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
#main.in .kpi:nth-child(2){animation-delay:.06s}#main.in .kpi:nth-child(3){animation-delay:.12s}#main.in .kpi:nth-child(4){animation-delay:.18s}
#main.in .qa button{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
#main.in .qa button:nth-child(2){animation-delay:.05s}#main.in .qa button:nth-child(3){animation-delay:.1s}#main.in .qa button:nth-child(4){animation-delay:.15s}#main.in .qa button:nth-child(5){animation-delay:.2s}#main.in .qa button:nth-child(6){animation-delay:.25s}
/* halka / ilerleme */
.ring svg circle:last-of-type{transition:stroke-dashoffset 1.2s cubic-bezier(.3,1,.4,1)}
.pbar i,.bar i{background-size:200% 100%;animation:barFlow 3s linear infinite;background-image:linear-gradient(90deg,#10b981,#6ee7b7,#10b981)}
.chart rect{transform-origin:bottom;transform-box:fill-box}
#main.in .chart rect{animation:grow .8s cubic-bezier(.3,1.2,.5,1) both}
@keyframes grow{from{transform:scaleY(0)}}
/* kutlama */
.celebox{background-size:200% 200%;animation:pop .5s cubic-bezier(.3,1.5,.5,1),heroShift 6s ease-in-out infinite alternate}
.celebox::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-1;background:conic-gradient(from 0deg,#FF9677,#F54768,#974063,#FF9677);filter:blur(14px);opacity:.7;animation:spin 6s linear infinite}
.celebox{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* tema geçişi */
html.tr body{transition:background-color .6s}
@media (max-width:700px){.hero .big{animation:none;-webkit-text-fill-color:#fff;background:none}.app::before{display:none}}
@media print{.card::after,.kpi::after,.hero .big{animation:none}}

/* ---------- arşiv (satılan araçlar) ---------- */
.arq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:6px}
.arqb{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:15px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s}
.arqb:hover{transform:translateY(-4px);border-color:var(--plate);box-shadow:var(--shadow-lg)}
.arqb:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.arqb small{color:var(--muted);font-weight:700;font-size:12px}
.arqb b{font:700 22px var(--f-display);letter-spacing:-.02em}
.arqb span{font:600 12.5px var(--f-mono);color:var(--muted)}
.arqb.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 18px 34px -14px rgba(245,71,104,.7)}
.arqb.on small,.arqb.on span{color:rgba(255,255,255,.85)}
.arnav{display:inline-flex;align-items:center;gap:8px}
.arnav b{font:700 15px var(--f-display);min-width:150px;text-align:center}
.arbars{display:flex;align-items:flex-end;gap:5px;height:160px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.arbar{all:unset;box-sizing:border-box;cursor:pointer;flex:1 0 22px;max-width:70px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.arbar i{display:flex;justify-content:center;width:100%;height:var(--h);min-height:4px;border-radius:9px 9px 4px 4px;background:var(--grad);position:relative;transform-origin:bottom;transition:filter .2s,transform .2s;box-shadow:0 8px 16px -8px rgba(245,71,104,.7)}
.arbar i.z{background:var(--surface2);box-shadow:none;min-height:4px}
.arbar i em{font-style:normal;font-weight:700;color:#fff;font-size:11px;padding-top:3px}
.arbar:hover i{filter:brightness(1.12);transform:scaleY(1.04)}
.arbar:focus-visible{outline:2px solid var(--plate);outline-offset:2px;border-radius:8px}
#main.in .arbar i{animation:grow .7s cubic-bezier(.3,1.2,.5,1) both}
@media (max-width:700px){.arq{grid-template-columns:repeat(2,minmax(0,1fr))}.arnav{width:100%;justify-content:space-between}.arnav b{min-width:0;flex:1}.arbars{height:130px}}
@media (max-width:700px){.chips.seg{display:flex;width:100%}.chips.seg .chip{flex:1;text-align:center;padding:9px 6px;font-size:12.5px}}

/* =====================================================================
   GÖRSEL ŞÖLEN: grafikler, düğmeler, paneller
   ===================================================================== */
/* --- grafik: ciro/kâr çubukları --- */
.chart .mg{cursor:default}
.chart .hb{fill:transparent;transition:fill .25s}
.chart .mg:hover .hb{fill:color-mix(in srgb,var(--plate) 10%,transparent)}
.chart .mg.cur .hb{fill:color-mix(in srgb,var(--accent) 7%,transparent)}
.chart rect.b1,.chart rect.b2{transition:transform .25s,filter .25s;transform-origin:bottom;transform-box:fill-box}
.chart rect.b1{filter:drop-shadow(0 6px 7px rgba(65,67,106,.35))}
.chart rect.b2{filter:drop-shadow(0 6px 9px rgba(245,71,104,.45))}
.chart .mg:hover rect.b1,.chart .mg:hover rect.b2{filter:brightness(1.1) drop-shadow(0 8px 12px rgba(245,71,104,.5))}
.chart .bv{opacity:0;fill:var(--ink);font:700 10.5px var(--f-mono);transition:opacity .2s,transform .2s;transform:translateY(5px)}
.chart .mg:hover .bv,.chart .mg.cur .bv{opacity:1;transform:none}
.chart .mn{font-weight:600}
.chart .mg.cur .mn{fill:var(--accent);font-weight:700}
.chart .grid-l{stroke-dasharray:3 5}
.chart .kl{fill:none;stroke:url(#gkl);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;filter:drop-shadow(0 4px 6px rgba(245,71,104,.5));pointer-events:none}
.chart .kd{fill:var(--surface);stroke:var(--accent);stroke-width:2.5;transform-box:fill-box;transform-origin:center;pointer-events:none}
#main.in .chart rect.b1,#main.in .chart rect.b2{animation:grow .9s cubic-bezier(.3,1.2,.5,1) both;animation-delay:calc(var(--i,0)*.09s)}
#main.in .chart .kl{animation:draw 1.6s .35s cubic-bezier(.4,0,.2,1) both}
#main.in .chart .kd{animation:popDot .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(.5s + var(--i,0)*.17s)}
.chart rect.hb{animation:none!important}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes popDot{from{transform:scale(0)}}
.legend span{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;background:var(--surface2)}
.legend i{border-radius:50%;box-shadow:0 0 8px currentColor}
/* --- halka, donut, ilerleme, mini grafik --- */
.ring svg circle.seg,.ring svg circle.rg{transition:stroke-width .25s;filter:drop-shadow(0 0 5px rgba(245,71,104,.35))}
.ring svg circle.seg:hover{stroke-width:18}
#main.in .ring svg circle.seg,#main.in .ring svg circle.rg{animation:segIn 1.3s cubic-bezier(.3,.9,.4,1) both;animation-delay:calc(var(--i,0)*.14s)}
@keyframes segIn{from{stroke-dasharray:0 300}}
.ring b{text-shadow:0 2px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 80%,color-mix(in srgb,var(--accent) 45%,transparent) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 5s linear infinite;pointer-events:none;opacity:.8}
.pbar{height:14px;border-radius:10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.pbar i{position:relative;overflow:hidden;background:linear-gradient(90deg,#10b981,#34d399,#10b981);background-size:200% 100%;animation:barFlow 3s linear infinite,grow2 1.2s cubic-bezier(.3,1,.4,1) both;transform-origin:left}
.pbar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 8px,transparent 8px 16px);animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:32px 0}}
@keyframes grow2{from{transform:scaleX(0)}}
.spark .sl{stroke-dasharray:1;filter:drop-shadow(0 3px 6px rgba(255,255,255,.5))}
#main.in .spark .sl{animation:draw 1.8s .2s ease both}
.spark .sd{transform-box:fill-box;transform-origin:center;animation:dotp 2s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff)}
@keyframes dotp{50%{transform:scale(1.7);opacity:.7}}
/* --- hero baloncukları --- */
.hero>.bub{position:absolute;z-index:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,.04));pointer-events:none;animation:rise 14s linear infinite;bottom:-40px}
.hero>.b1{left:8%;width:18px;height:18px}
.hero>.b2{left:26%;width:30px;height:30px;animation-duration:19s;animation-delay:-6s}
.hero>.b3{left:58%;width:14px;height:14px;animation-duration:12s;animation-delay:-3s}
.hero>.b4{left:82%;width:24px;height:24px;animation-duration:17s;animation-delay:-9s}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:1}100%{transform:translateY(-330px) translateX(24px);opacity:0}}
/* --- ipucu kutusu --- */
.fxtip{position:fixed;left:0;top:0;z-index:150;pointer-events:none;display:flex;flex-direction:column;gap:2px;padding:9px 13px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:12px;opacity:0;transition:opacity .15s;box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,.1) inset;white-space:nowrap}
.fxtip.on{opacity:1}
.fxtip b{font:700 13px var(--f-display);margin-bottom:2px}
.fxtip span{font-family:var(--f-mono);opacity:.9}
/* --- düğmeler --- */
.btn{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface2) 70%,var(--surface)));box-shadow:0 1px 0 rgba(255,255,255,.65) inset,0 3px 8px -4px rgba(30,31,64,.28)}
:root[data-theme="dark"] .btn{box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 3px 8px -4px rgba(0,0,0,.6)}
.btn:hover{border-color:var(--accent);box-shadow:0 1px 0 rgba(255,255,255,.65) inset,0 12px 22px -10px rgba(245,71,104,.55);transform:translateY(-2px)}
.btn:active{box-shadow:inset 0 3px 8px rgba(0,0,0,.22);transform:translateY(1px) scale(.97)}
.btn.primary{box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 14px 26px -10px rgba(245,71,104,.8);animation:halo 3s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 14px 26px -10px rgba(245,71,104,.8),0 0 0 6px rgba(245,71,104,.13)}}
.btn.primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 20px 34px -10px rgba(245,71,104,.95),0 0 0 6px rgba(245,71,104,.18)}
.btn.danger:hover{box-shadow:0 12px 22px -10px rgba(211,32,47,.5);border-color:var(--bad)}
.btn.wa{animation:none;box-shadow:0 12px 22px -10px rgba(18,140,74,.85)}
.hero .btn.primary{animation:none}
.chip{background:linear-gradient(180deg,var(--surface),var(--surface2))}
.chip:hover{border-color:var(--accent);box-shadow:0 8px 16px -8px rgba(245,71,104,.5)}
.chip[aria-pressed="true"]{animation:chipPop .4s cubic-bezier(.3,1.7,.5,1);box-shadow:0 10px 20px -8px rgba(245,71,104,.85),0 1px 0 rgba(255,255,255,.4) inset}
.chips.seg .chip:hover{box-shadow:none}
.chips.seg .chip[aria-pressed="true"]{animation:none;background:var(--surface);box-shadow:0 4px 12px -2px rgba(30,31,64,.25)}
@keyframes chipPop{from{transform:scale(.88)}}
.srbtn:hover{box-shadow:0 0 0 1px rgba(255,150,119,.5),0 10px 24px -10px rgba(245,71,104,.7)}
/* --- paneller --- */
.card,.kpi,.arqb,.qa button{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,color-mix(in srgb,var(--line) 70%,transparent),var(--line)) border-box}
:root:not([data-theme="dark"]) .card{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--surface2) 35%,#fff)) padding-box,linear-gradient(135deg,var(--line),color-mix(in srgb,var(--line) 60%,transparent)) border-box}
.card:hover,.kpi:hover,.arqb:hover,.qa button:hover{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box}
.arqb.on{background:var(--grad)}
.card>h3:first-child::before{animation:barPulse 3s ease-in-out infinite}
@keyframes barPulse{50%{height:24px;box-shadow:0 0 12px rgba(245,71,104,.7)}}
.kpi::before{background:var(--grad);background-size:200% 100%;animation:barFlow 4s linear infinite}
.kpi b{background:linear-gradient(100deg,var(--ink),var(--plate));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kpi b .pos,.kpi b .neg{-webkit-text-fill-color:currentColor}
.card .head,.sec{position:relative}
.sec::after{content:"";position:absolute;left:0;bottom:-1px;width:70px;height:2px;background:var(--grad);border-radius:2px}
/* --- tablolar, rozetler, uyarılar --- */
thead th{background:linear-gradient(180deg,var(--surface2),color-mix(in srgb,var(--surface2) 60%,var(--surface)));position:relative}
thead th:first-child{border-top-left-radius:16px}
tr.click:hover td{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),color-mix(in srgb,var(--plate) 6%,var(--surface)))}
tr.click:hover{transform:translateX(2px)}
tr.click{transition:transform .2s}
.badge{transition:transform .2s,box-shadow .2s}
.badge:hover{transform:scale(1.07)}
.badge.ok{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 12%,transparent)}
.badge.bad{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 12%,transparent)}
.badge.warn{box-shadow:0 0 0 3px color-mix(in srgb,#ffb020 16%,transparent)}
.alert{transition:transform .2s,box-shadow .2s}
.alert:hover{transform:translateX(4px);box-shadow:0 10px 22px -12px rgba(30,31,64,.4)}
.tip{position:relative;overflow:hidden}
.tip::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 6s ease-in-out infinite}
/* --- pencereler, bildirim, arama --- */
.modal{position:relative;overflow:hidden}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--grad);background-size:200% 100%;animation:barFlow 4s linear infinite}
.toast{display:flex;align-items:center;gap:10px;padding:13px 20px 15px;overflow:hidden;animation:toastIn .45s cubic-bezier(.3,1.6,.5,1)}
.toast::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px var(--accent);flex:none}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--grad);transform-origin:left;animation:toastBar 2.2s linear forwards}
@keyframes toastIn{from{transform:translate(-50%,30px) scale(.85);opacity:0}}
@keyframes toastBar{to{transform:scaleX(0)}}
.srbox{box-shadow:0 40px 90px rgba(1,25,21,.55),0 0 0 1px rgba(245,71,104,.3),0 0 70px -12px rgba(245,71,104,.45)}
.sri{transition:background .15s,transform .15s}
.sri:hover,.sri[aria-selected="true"]{transform:translateX(4px);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface2))}
/* --- sayfa yükleme çizgisi --- */
#main.in::before{content:"";position:fixed;left:0;top:0;height:3px;width:100%;background:var(--grad);transform-origin:left;animation:loadbar 1s ease-out forwards;z-index:200;box-shadow:0 0 14px rgba(245,71,104,.9);pointer-events:none}
@keyframes loadbar{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
/* --- araç kartı parıltısı --- */
.vcard .vph::before{content:"";position:absolute;top:0;bottom:0;width:35%;left:-50%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);z-index:2;transition:left .8s ease;pointer-events:none}
.vcard:hover .vph::before{left:130%}
.vcard .vp b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media (max-width:700px){.hero>.bub{display:none}.ring::after{display:none}.btn.primary{animation:none}}
@media print{.fxtip,#main.in::before{display:none}}

/* =====================================================================
   KAYDIRMA ÇUBUKLARI GİZLİ + iOS / ANDROID UYUMU

*{scrollbar-width:none;-ms-overflow-style:none}

@media (min-width:901px){@supports (height:100dvh){.side{height:calc(100dvh - 28px)}}}
button,.btn,.chip,.qa button,.arqb,.arbar,nav button,.sl-row,.pz,.vcard,tr.click,summary{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-appearance:none;appearance:none;border-radius:13px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

.modal-back,.srres,.sheetbox,.tw,.rtw,.strip,.arbars{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav{background:var(--side)!important}.banner{background:var(--surface)}}
@supports not (background:color-mix(in srgb,red,blue)){.tip{background:var(--surface2)}.alert.bad,.alert.warn{background:var(--surface2)}.legend span{background:var(--surface2)}}
@media (hover:none){
  .btn:hover,.card:hover,.kpi:hover,.vcard:hover,.qa button:hover,.arqb:hover,.arbar:hover i,tr.click:hover,.alert:hover,.chip:hover,.pz:hover,.sri:hover,nav button:hover{transform:none}

}

}
@media (max-width:700px){
  nav{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px))}
  .fab{right:max(18px,env(safe-area-inset-right,0px))}
  .modal{padding-top:calc(18px + env(safe-area-inset-top,0px))}
}

/* =====================================================================
   RAPOR ÇIKTISI: logolu, renkli, filigranlı
   ===================================================================== */
.rpt-doc{--p-acc:#F54768;--p-acc2:#974063;--p-ink:#1e1f40;--p-mute:#62648a;--p-line:#e8e1f0;--p-zebra:#faf7fc;position:relative;border-radius:26px;box-shadow:var(--shadow-lg)}
.rpt-doc>.rpt-band,.rpt-doc>.rpt-body{position:relative;z-index:1}
.rpt-wm{position:absolute;inset:140px 0 0;z-index:0;background:var(--logo) center 38%/min(62%,520px) no-repeat;opacity:.055;transform:rotate(-12deg);pointer-events:none}
.rpt-band{padding:30px 34px 34px;background:radial-gradient(circle at 92% -30%,rgba(255,255,255,.22),transparent 46%),radial-gradient(circle at 6% 150%,rgba(245,71,104,.55),transparent 52%),linear-gradient(120deg,#25264a 0%,#41436A 42%,#974063 100%);overflow:hidden}
.rpt-band::after{height:6px;background:linear-gradient(90deg,#FF9677,#F54768,#974063,#41436A)}
.rpt-deco{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.055) 0 2px,transparent 2px 22px);-webkit-mask:linear-gradient(90deg,transparent 30%,#000);mask:linear-gradient(90deg,transparent 30%,#000)}
.rpt-brand,.rpt-meta{position:relative;z-index:1}
.rpt-logo{padding:9px 16px;border-radius:20px;background:#fff;box-shadow:0 14px 30px -10px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.18)}
.rpt-logo img{height:68px}
.rpt-brand b{font-size:22px;letter-spacing:-.02em}
.rpt-band .rpt-meta{padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rpt-body{padding:30px 34px 30px}
.rpt-title h2{font-size:34px;position:relative;padding-bottom:12px;color:var(--p-ink);background:linear-gradient(100deg,#25264a,#974063 60%,#F54768);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rpt-title h2::after{content:"";position:absolute;left:0;bottom:0;width:72px;height:5px;border-radius:4px;background:linear-gradient(90deg,#F54768,#FF9677)}
.rpt-chip{background:linear-gradient(180deg,#fff,#f6eef6);color:#974063;border:1px solid #ecd9e6;font-weight:650}
.rpt-sum{gap:12px}
.rpt-sum>div{display:flex;align-items:center;gap:13px;border:1px solid var(--p-line);border-left:0;border-radius:18px;padding:14px 16px;background:linear-gradient(180deg,#fff,#faf7fc);box-shadow:0 10px 24px -16px rgba(65,67,106,.5);position:relative;overflow:hidden}
.rpt-sum>div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#F54768,#FF9677)}
.rpt-sum>div:nth-child(4n+2)::before{background:linear-gradient(180deg,#974063,#c0577f)}
.rpt-sum>div:nth-child(4n+3)::before{background:linear-gradient(180deg,#41436A,#6d70b5)}
.rpt-sum>div:nth-child(4n+4)::before{background:linear-gradient(180deg,#FF9677,#ffc2a8)}
.rpt-sum i{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#FF9677,#F54768);box-shadow:0 10px 18px -8px rgba(245,71,104,.7)}
.rpt-sum>div:nth-child(4n+2) i{background:linear-gradient(135deg,#c0577f,#974063)}
.rpt-sum>div:nth-child(4n+3) i{background:linear-gradient(135deg,#6d70b5,#41436A)}
.rpt-sum>div:nth-child(4n+4) i{background:linear-gradient(135deg,#ffc2a8,#FF9677)}
.rpt-sum i svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rpt-sum>div>span{min-width:0}
.rpt-sum b{font-size:20px}
.rpt-doc .rtw{border:0;border-radius:18px;box-shadow:0 0 0 1px var(--p-line),0 14px 30px -20px rgba(65,67,106,.5);overflow:hidden;background:rgba(255,255,255,.86)}
.rpt-doc .rpt th{background:linear-gradient(135deg,#41436A,#974063);color:#fff;border-bottom:0;font-size:10.5px;padding:12px 12px}
.rpt-doc .rpt td{padding:9px 12px}
.rpt-doc .rpt tbody tr:nth-child(even) td{background:var(--p-zebra)}
.rpt-doc .rpt tr.g td{background:linear-gradient(90deg,#f6e4ee,#fbf2f6)!important;color:#974063;border-left:5px solid #F54768}
.rpt-doc .rpt tr.ara td{background:#f3eef8!important;color:#41436A}
.rpt-doc .rpt tr.tot td{background:linear-gradient(135deg,#25264a,#41436A 55%,#974063)!important;color:#fff;font-size:13.5px;padding:13px 12px}
.rpt-doc .rpt tr.tot td:first-child{border-radius:0 0 0 18px}.rpt-doc .rpt tr.tot td:last-child{border-radius:0 0 18px 0}
.rpt-doc .badge.info{background:#efe6f5;color:#974063}
.rpt-sign{margin-top:48px}
.rpt-sign div{border-top:2px dashed #cbbfd8;padding-top:8px;font-weight:600}
.rpt-foot{align-items:center;border-top:2px solid transparent;border-image:linear-gradient(90deg,#FF9677,#F54768,#974063,#41436A) 1}
.rpt-fl{display:inline-flex;align-items:center;gap:10px}
.rpt-mark{width:34px;height:34px;border-radius:10px;background:#fff var(--logo) center/84% no-repeat;border:1px solid var(--p-line)}
@media (max-width:700px){.rpt-band{padding:20px 18px 24px}.rpt-logo img{height:48px}.rpt-body{padding:20px 16px}.rpt-title h2{font-size:26px}.rpt-wm{inset:120px 0 0}}
@media print{
  .rpt-doc{border-radius:0!important;background:#fff!important}
  .rpt-wm{position:fixed!important;inset:0!important;opacity:.06!important;background-position:center!important;background-size:60%!important;z-index:0}
  .rpt-band{padding:18px 22px 22px!important}
  .rpt-logo img{height:56px}
  .rpt-sum>div,.rpt-doc .rtw{box-shadow:none!important}
  .rpt-doc .rtw{border:1px solid #e8e1f0}
}
.rpt-sum{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.rpt-sum b{font-size:18px;white-space:nowrap}
.rpt-doc .rpt th{padding:12px 9px}
.rpt-doc .rpt td{padding:9px 9px}
.rpt-doc .rpt{font-size:12px}
.rpt-doc .rpt tr.tot td{background:#35375f!important;background-image:none!important}
.rpt-doc .rpt th{background:#5a3f6f;background-image:linear-gradient(90deg,#41436A,#974063);background-attachment:fixed}
.rpt-doc .rpt th{background:#4d3f6e!important;background-image:none!important}
.tw,.rtw{background-image:linear-gradient(90deg,var(--surface) 30%,transparent),linear-gradient(270deg,var(--surface) 30%,transparent),radial-gradient(farthest-side at 0 50%,rgba(40,30,80,.22),transparent),radial-gradient(farthest-side at 100% 50%,rgba(40,30,80,.22),transparent);background-position:0 0,100% 0,0 0,100% 0;background-repeat:no-repeat;background-size:44px 100%,44px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
.rpt-doc .rtw{--surface:#fff}
@media print{.rpt-title h2{background:none!important;-webkit-text-fill-color:#41436A!important;color:#41436A!important}.rtw{background-image:none!important}}

/* =====================================================================
   HAREKETLİ LOGO SAHNESİ + YENİ ARAMA ÇUBUĞU
   ===================================================================== */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.brand{padding:4px 4px 16px;gap:10px;align-items:center;text-align:center}
.logo-stage{position:relative;width:100%;max-width:216px;margin:2px auto 0;perspective:760px;animation:lgFloat 6s ease-in-out infinite}
.logo-stage::before{content:"";display:block;padding-top:69%}
.lg-aura{position:absolute;inset:-14% -10%;border-radius:50%;background:radial-gradient(closest-side,rgba(245,71,104,.55),rgba(151,64,99,.28) 52%,transparent 74%);filter:blur(16px);animation:lgAura 4.5s ease-in-out infinite}

const KEY='galeri-defteri.v1';

/* ---------- veri ---------- */
let db=null, storageOk=true, memory=null;
function emptyDb(){return {v:1,demo:false,firma:{ad:'Vefa Auto',vergiNo:'',vergiDairesi:'',tel:'',adres:'',yetkiNo:'',yetkiBitis:''},tax:{...DEFAULT_TAX},accounts:[],contacts:[],vehicles:[],options:[],requests:[],expenses:[],sales:[],inst:[],txs:[],makbuzlar:[]}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);d.tax={...DEFAULT_TAX,...(d.tax||{})};d.options=d.options||[];d.requests=d.requests||[];d.makbuzlar=d.makbuzlar||[];if(d.firma&&(!d.firma.ad||d.firma.ad==='Galeri Defteri'))d.firma.ad='Vefa Auto';return d}}catch(e){storageOk=false}
  return null;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageOk=false;memory=JSON.stringify(db)}
  try{if(window.__onSave)window.__onSave(db)}catch(e){}
}
const byId=(arr,id)=>arr.find(x=>x.id===id);

/* ---------- hesap fonksiyonları ---------- */
function alisNet(v){const r=+v.alisKdvOran||0;return(r>0&&v.alisKdvIndir)?v.alisFiyat/(1+r/100):(+v.alisFiyat||0)}
function alisKdv(v){return(+v.alisFiyat||0)-alisNet(v)}
function expNet(e){return(e.indirilir&&e.kdvOran>0)?e.tutar/(1+e.kdvOran/100):(+e.tutar||0)}
function expKdv(e){return(+e.tutar||0)-expNet(e)}
function vExp(id){return db.expenses.filter(e=>e.aracId===id)}
function maliyet(v){return alisNet(v)+sum(vExp(v.id),expNet)}
function calcKdv(mode,fiyat,alis){
  const t=db.tax;let r=0,base=fiyat;
  if(mode==='k1')r=+t.kdvIkinciEl;else if(mode==='k20')r=+t.kdvGenel;else if(mode==='ozel'){r=+t.kdvGenel;base=Math.max(0,fiyat-alis)}else return 0;
  return base*r/(100+r);
}
function saleKar(s){const v=byId(db.vehicles,s.aracId);return s.fiyat-s.kdv-(v?maliyet(v):0)+(s.vadeFarki||0)}
function kasaBakiye(a){return(+a.acilis||0)+sum(db.txs.filter(t=>t.hesapId===a.id&&t.yon==='giris'),t=>t.tutar)-sum(db.txs.filter(t=>t.hesapId===a.id&&t.yon==='cikis'),t=>t.tutar)}
function cariBakiye(id){
  return sum(db.sales.filter(s=>s.cariId===id),s=>s.fiyat+(s.vadeFarki||0))
   -sum(db.txs.filter(t=>t.cariId===id&&t.yon==='giris'),t=>t.tutar)
   -sum(db.vehicles.filter(v=>v.alisCari===id),v=>v.alisFiyat)
   -sum(db.expenses.filter(e=>e.cariId===id),e=>e.tutar)
   +sum(db.txs.filter(t=>t.cariId===id&&t.yon==='cikis'),t=>t.tutar);
}
function instKalan(i){return Math.max(0,r2(i.tutar-(i.odenen||0)))}
function instDurum(i){
  if(i.durum==='iptal'||i.durum==='protesto'||i.durum==='ciro')return i.durum;
  if(instKalan(i)<=0.005)return'odendi';
  if(i.vade<today())return'gecikti';
  return(i.odenen>0)?'kismi':'bekliyor';
}
const DURUM_ET={odendi:['Ödendi','ok'],gecikti:['Vadesi geçti','bad'],bekliyor:['Bekliyor',''],kismi:['Kısmi ödendi','warn'],protesto:['Protestolu','bad'],ciro:['Ciro edildi','info'],iptal:['İptal','']};
const gecikmeGun=i=>(instKalan(i)>0.005&&['gecikti','kismi'].includes(instDurum(i)))?Math.max(0,diffDays(today(),i.vade)):0;
const gecikmeFaiz=i=>instKalan(i)*(db.tax.gecikmeAylik/100)*(gecikmeGun(i)/30);
const instAcik=i=>['bekliyor','gecikti','kismi'].includes(instDurum(i));
function addTx(o){const t={id:uid(),tarih:o.tarih||today(),hesapId:o.hesapId,yon:o.yon,tutar:r2(o.tutar),aciklama:o.aciklama||'',cariId:o.cariId||'',ref:o.ref||'',yontem:o.yontem||''};db.txs.push(t);return t}
function addContact(o){const c={id:uid(),ad:o.ad,tur:o.tur||'musteri',tel:o.tel||'',kimlik:o.kimlik||'',adres:o.adres||'',not:o.not||''};db.contacts.push(c);return c.id}
function contactName(id){const c=byId(db.contacts,id);return c?c.ad:'—'}
function vTitle(v){return[v.marka,v.model].filter(Boolean).join(' ')+(v.yil?' '+v.yil:'')}

/* ---------- işlemler ---------- */
function saveVehicle(d,editId){
  let cari=d.alisCari;if(!editId&&!cari&&d.yeniAd)cari=addContact({ad:d.yeniAd,tel:d.yeniTel,tur:'tedarikci'});
  const rec={plaka:(d.plaka||'').toUpperCase().trim(),marka:d.marka,model:d.model,yil:d.yil,km:d.km,yakit:d.yakit,vites:d.vites,renk:d.renk,tip:d.tip,cc:d.cc,sase:d.sase,durum:d.durum,
    alisTarihi:d.alisTarihi,alisKaynak:d.alisKaynak,alisFiyat:+d.alisFiyat||0,alisKdvOran:+d.alisKdvOran||0,alisKdvIndir:!!d.alisKdvIndir,liste:+d.liste||0,
    muayene:d.muayene,sigorta:d.sigorta,kasko:d.kasko,mtv:+d.mtv||0,not:d.not,ortakAd:d.ortakAd||'',ortakPay:+d.ortakPay||0};
  if(editId){const v=byId(db.vehicles,editId);Object.assign(v,rec);save();return v}
  const v={id:uid(),...rec,alisCari:cari||'',satisId:''};db.vehicles.push(v);
  if(d.alisHesap&&v.alisFiyat>0)addTx({tarih:v.alisTarihi,hesapId:d.alisHesap,yon:'cikis',tutar:v.alisFiyat,aciklama:'Araç alışı – '+v.plaka,cariId:v.alisCari,ref:v.id,yontem:d.yontem});
  save();return v;
}
function deleteVehicle(id){
  db.expenses.filter(e=>e.aracId===id).forEach(e=>db.txs=db.txs.filter(t=>t.ref!==e.id));
  db.options.filter(o=>o.aracId===id).forEach(o=>{db.txs=db.txs.filter(t=>t.ref!==o.id)});db.options=db.options.filter(o=>o.aracId!==id);
  db.expenses=db.expenses.filter(e=>e.aracId!==id);db.txs=db.txs.filter(t=>t.ref!==id);
  db.sales.filter(s=>s.aracId===id).forEach(s=>removeSale(s.id,true));
  db.vehicles=db.vehicles.filter(v=>v.id!==id);delete PH[id];putPhotos(id);save();
}
function saveExpense(d,editId){
  let cari=d.cariId;if(!cari&&d.yeniAd)cari=addContact({ad:d.yeniAd,tur:'tedarikci'});
  const rec={tarih:d.tarih,aracId:d.aracId||'',kategori:d.kategori,aciklama:d.aciklama,tutar:+d.tutar||0,kdvOran:+d.kdvOran||0,indirilir:!!d.indirilir,cariId:cari||'',hesapId:d.hesapId||'',yontem:d.hesapId?d.yontem:''};
  if(editId){const e=byId(db.expenses,editId);Object.assign(e,rec);db.txs=db.txs.filter(t=>t.ref!==editId)}
  const e=editId?byId(db.expenses,editId):Object.assign({id:uid()},rec);
  if(!editId)db.expenses.push(e);
  if(e.hesapId&&e.tutar>0){const v=byId(db.vehicles,e.aracId);addTx({tarih:e.tarih,hesapId:e.hesapId,yon:'cikis',tutar:e.tutar,aciklama:e.kategori+(v?' – '+v.plaka:''),cariId:e.cariId,ref:e.id,yontem:e.yontem})}
  save();
}
function deleteExpense(id){db.expenses=db.expenses.filter(e=>e.id!==id);db.txs=db.txs.filter(t=>t.ref!==id);save()}
function createSale(d){
  const v=byId(db.vehicles,d.aracId);
  let cari=d.cariId;if(!cari&&d.yeniAd)cari=addContact({ad:d.yeniAd,tel:d.yeniTel,tur:'musteri'});
  const fiyat=+d.fiyat,kap=Math.min(+d.kapora||0,fiyat),tak=Math.min(+d.takasBedel||0,fiyat-kap);

  return{ciro:sum(sat,s=>s.fiyat-s.kdv),kar:sum(sat,saleKar)-sum(gg,expNet),adet:sat.length};
}

  const W=500,H=250,L=46,R=8,T=16,B=28,pw=W-L-R,ph=H-T-B;const y=v=>T+(hi-v)/(hi-lo)*ph;

  for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4;s+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fk(v)+'</text>'}
  const gw=pw/ks.length,bw=Math.min(26,gw/3),pts=[];
  data.forEach((d,i)=>{const cx=L+gw*i+gw/2,mn=MONTHS[+ks[i].slice(5)-1],last=i===data.length-1;
    s+='<g class="mg'+(last?' cur':'')+'" data-tip="'+esc(mn+'|Ciro: '+TL(d.ciro)+'|Net kâr: '+TL(d.kar))+'"><rect class="hb" x="'+(L+gw*i+4)+'" y="'+T+'" width="'+(gw-8)+'" height="'+ph+'" rx="12"/>';
    [[d.ciro,'b1',-bw-1],[d.kar,'b2',1]].forEach(a=>{const y0=y(0),y1=y(a[0]);s+='<rect class="'+a[1]+'" style="--i:'+i+'" x="'+(cx+a[2])+'" y="'+Math.min(y0,y1)+'" width="'+bw+'" height="'+Math.max(1,Math.abs(y0-y1))+'" rx="6"/><text class="bv" x="'+(cx+a[2]+bw/2)+'" y="'+(Math.min(y0,y1)-5)+'" text-anchor="middle">'+fk(a[0])+'</text>'});
    pts.push([cx+1+bw/2,y(d.kar)]);
    s+='<text class="mn" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+mn+'</text></g>'});
  if(pts.length>1){const dd=pts.map((q,i)=>{if(!i)return'M'+q[0].toFixed(1)+' '+q[1].toFixed(1);const p0=pts[i-1],mx=((p0[0]+q[0])/2).toFixed(1);return'C'+mx+' '+p0[1].toFixed(1)+' '+mx+' '+q[1].toFixed(1)+' '+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ');
    s+='<path class="kl" d="'+dd+'" pathLength="1"/>'+pts.map((q,i)=>'<circle class="kd" style="--i:'+i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4"/>').join('')}
  return s+'</svg><div class="legend"><span><i style="background:var(--plate)"></i>Ciro (KDV hariç)</span><span><i style="background:var(--b2)"></i>Net kâr (genel giderler düşülmüş)</span></div>';
}
