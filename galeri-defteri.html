const PH={};let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('galeri-defteri-foto',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{idb=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})}
async function loadPhotos(){
  if(window.__PHOTOS){Object.assign(PH,window.__PHOTOS);render();return}
  if(!(await idbOpen()))return;
  try{await new Promise(res=>{const c=idb.transaction('p').objectStore('p').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){PH[cur.key]=cur.value;cur.continue()}else res()};c.onerror=()=>res()})}catch(e){}
  render();
}
function putPhotos(id){try{if(window.__onPhoto)window.__onPhoto(id,PH[id]||[])}catch(e){}if(!idb)return;try{const st=idb.transaction('p','readwrite').objectStore('p');if(PH[id]&&PH[id].length)st.put(PH[id],id);else st.delete(id)}catch(e){}}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,960/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function addPhotos(id,files){
  const list=PH[id]||(PH[id]=[]);let n=0;
  for(const f of Array.from(files||[])){if(list.length>=8){toast('Bir araca en fazla 8 fotoğraf eklenir');break}try{list.push(await shrink(f));n++}catch(e){}}
  if(n){putPhotos(id);toast(n+' fotoğraf eklendi'+(idb?'':'. Depolama kapalı, yalnızca bu oturumda kalır'))}
  render();
}

function rpCompute(id){
  const R=RP[id],F=S.rf[id]||(S.rf[id]={});
  let rows=R.rows();
  R.filters.forEach(sp=>{
    const a=F[sp.id],b=F[sp.id+'2'];
    if(sp.t==='range'){if(a)rows=rows.filter(r=>r[sp.f]>=a);if(b)rows=rows.filter(r=>r[sp.f]<=b)}
    else if(sp.t==='nrange'){if(+a)rows=rows.filter(r=>r[sp.f]>=+a);if(+b)rows=rows.filter(r=>r[sp.f]<=+b)}
    else if(sp.t==='min'){if(+a)rows=rows.filter(r=>r[sp.f]>=+a)}
    else if(sp.t==='select'){if(a)rows=rows.filter(r=>sp.p?sp.p(r,a):String(r[sp.f])===String(a))}
    else if(sp.t==='text'){if(a){const q=String(a).toLocaleLowerCase('tr');rows=rows.filter(r=>sp.s.some(k=>String(r[k]==null?'':r[k]).toLocaleLowerCase('tr').includes(q)))}}
  });
  const col=R.cols.find(c=>c.k===F.sort)||R.cols.find(c=>c.k===R.sort)||R.cols[0],dir=(F.dir||R.dir||'asc')==='desc'?-1:1;
  rows.sort((x,y)=>{x=x[col.k];y=y[col.k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(typeof x==='number'&&typeof y==='number')?(x-y)*dir:String(x).localeCompare(String(y),'tr')*dir});
  const g=R.groups.find(x=>x.id===F.grp);let groups=null;
  if(g){const m=new Map();rows.forEach(r=>{const k=g.key(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)});groups=[...m.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'tr')).map(([k,rs])=>({k,l:g.lab?g.lab(k):k,rows:rs}))}
  return{R,F,rows,groups,g,col,dir};
}

  const rowH=r=>'<tr>'+cols.map(x=>'<td'+rcls(x)+'>'+rpFmt(x,r)+'</td>').join('')+'</tr>';
  const sumRow=(label,rs,cl)=>'<tr class="'+cl+'">'+cols.map((x,i)=>'<td'+rcls(x)+'>'+(i===0?esc(label):rpSumCell(x,rs))+'</td>').join('')+'</tr>';
  let h='<div class="rtw"><table class="rpt"><thead><tr>'+cols.map(x=>'<th'+rcls(x)+'>'+esc(x.l)+'</th>').join('')+'</tr></thead><tbody>';
  if(!c.rows.length)h+='<tr><td colspan="'+cols.length+'" class="muted">Seçilen filtrelere uyan kayıt yok.</td></tr>';
  else{
    if(c.groups)c.groups.forEach(g=>{h+='<tr class="g"><td colspan="'+cols.length+'">'+esc(c.g.l)+': '+esc(g.l)+' · '+g.rows.length+' kayıt</td></tr>'+g.rows.map(rowH).join('')+sumRow('Ara toplam',g.rows,'ara')});
    else h+=c.rows.map(rowH).join('');
    h+=sumRow('Genel toplam ('+c.rows.length+' kayıt)',c.rows,'tot');

function rpFl(c){
  const F=c.F,fl=[];
  c.R.filters.forEach(sp=>{const a=F[sp.id],b=F[sp.id+'2'];
    if(sp.t==='range'&&(a||b))fl.push(sp.l+': '+(a?fd(a):'…')+' – '+(b?fd(b):'…'));
    else if(sp.t==='nrange'&&(+a||+b))fl.push(sp.l+': '+(+a?TL(+a):'…')+' – '+(+b?TL(+b):'…'));
    else if(sp.t==='min'&&+a)fl.push(sp.l+': '+a);
    else if(sp.t==='select'&&a){const o=(typeof sp.o==='function'?sp.o():sp.o).find(x=>String(x[0])===String(a));fl.push(sp.l+': '+(o?o[1]:a))}
    else if(sp.t==='text'&&a)fl.push('Arama: '+a)});
  return fl;
}

function rpMatrix(c){
  const cols=c.R.cols;
  const val=(x,r)=>x.f==='d'?fd(r[x.k]):(x.f==='p'||x.f==='m')?(r[x.k]==null?'':r2(r[x.k])):(r[x.k]==null?'':r[x.k]);
  const head=(c.groups?['Grup']:[]).concat(cols.map(x=>x.l)),body=[];
  const push=(r,g)=>body.push((c.groups?[g]:[]).concat(cols.map(x=>val(x,r))));
  if(c.groups)c.groups.forEach(g=>g.rows.forEach(r=>push(r,g.l)));else c.rows.forEach(r=>push(r));
  const tot=(c.groups?['']:[]).concat(cols.map((x,i)=>{if(i===0)return'Genel toplam';if(!x.sum)return'';const v=x.sum===1?sum(c.rows,r=>r[x.k]):x.sum(c.rows);return v==null?'':r2(v)}));
  return[head].concat(body,[tot]);
}

function rpPreset(v){

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.rf){(S.rf[S.rep]||(S.rf[S.rep]={}))[t.dataset.rf]=t.value;render();return}
  if(t.dataset.filter){S[t.dataset.filter]=t.value;render();return}
  if(t.dataset.firma){db.firma[t.dataset.firma]=t.value;save();$('#firmaAd').textContent=db.firma.ad||'Vefa Auto';return}
  if(t.hasAttribute&&t.hasAttribute('data-calc')){calcTools();return}
  if(modalState&&modalState.live&&t.closest('#mf'))modalState.live($('#mf'),e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.photo){addPhotos(t.dataset.photo,t.files);t.value='';return}
  if(t.dataset.tax){db.tax[t.dataset.tax]=parseFloat(t.value)||0;save();toast('Parametre kaydedildi');return}
  if(t.dataset.sel){S[t.dataset.sel]=t.value;render();return}
  if(t.hasAttribute&&t.hasAttribute('data-calc')){calcTools();return}
  if(modalState&&modalState.live&&t.closest('#mf'))modalState.live($('#mf'),e);
});

/* ===== kameradan plaka okuma ===== */
const PLK_L='ABCDEFGHIJKLMNOPRSTUVYZ',PLK_D='0123456789';
const CAM_IC='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg>';
const PLK_FIX_D={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',B:'8',G:'6',T:'7'},PLK_FIX_L={'0':'O','1':'I','2':'Z','5':'S','8':'B','6':'G','7':'T'};
/* OCR çıktısındaki metinden geçerli Türk plakası ayıklar: 2 rakam (01-81) + 1-3 harf + 2-4 rakam */
function plakaParse(raw){
  const t=String(raw||'').toUpperCase().replace(/İ/g,'I').replace(/[ÇĞÖŞÜ]/g,m=>({'Ç':'C','Ğ':'G','Ö':'O','Ş':'S','Ü':'U'}[m])).replace(/[^A-Z0-9]/g,'');
  let best=null;
  for(let st=0;st<t.length;st++)for(let len=5;len<=8&&st+len<=t.length;len++){
    const s=t.substr(st,len);
    for(let L=1;L<=3;L++){const D=len-2-L;if(D<2||D>4)continue;
      let cost=0,out='',bad=0;
      for(let k=0;k<len;k++){const c=s[k],wantD=(k<2||k>=2+L);
        if(wantD){if(PLK_D.includes(c))out+=c;else if(PLK_FIX_D[c]){out+=PLK_FIX_D[c];cost+=1}else bad=1}
        else{if(PLK_L.includes(c))out+=c;else if(PLK_FIX_L[c]){out+=PLK_FIX_L[c];cost+=1}else bad=1}}
      if(bad)continue;const il=+out.slice(0,2);if(il<1||il>81)continue;
      const sc=cost*2-len*.15+(st>0&&st+len<t.length?.2:0);if(!best||sc<best.sc)best={sc,p:out.slice(0,2)+' '+out.slice(2,2+L)+' '+out.slice(2+L)}}}
  return best?best.p:'';
}
/* --- dahili okuyucu: eşikleme, harf bölütleme, şablon eşleme --- */
let PLK_T=null;
function plkNorm(bits,w,h){/* bits: 0/1 dizisi w×h; bbox'a kırp, 20×28'e küçült */
  let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(bits[y*w+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;const bw=x1-x0+1,bh=y1-y0+1,o=new Float32Array(560);
  for(let j=0;j<28;j++)for(let i=0;i<20;i++){const sx0=x0+i*bw/20,sx1=x0+(i+1)*bw/20,sy0=y0+j*bh/28,sy1=y0+(j+1)*bh/28;let a=0,n=0;
    for(let y=Math.floor(sy0);y<Math.max(Math.ceil(sy1),Math.floor(sy0)+1);y++)for(let x=Math.floor(sx0);x<Math.max(Math.ceil(sx1),Math.floor(sx0)+1);x++){a+=bits[Math.min(h-1,y)*w+Math.min(w-1,x)];n++}
    o[j*20+i]=a/n>.5?1:0}
  return{v:o,ar:bw/bh}}
function plkTemplates(){
  if(PLK_T)return PLK_T;PLK_T=[];
  const fonts=['700 90px Inter,system-ui,sans-serif','700 90px "Plus Jakarta Sans",sans-serif','800 90px Sora,sans-serif','700 90px Arial,"Liberation Sans",Helvetica,sans-serif','700 90px "DejaVu Sans",Verdana,sans-serif','600 90px Roboto,sans-serif','700 90px "Segoe UI",Tahoma,sans-serif'];
  const cv=document.createElement('canvas');cv.width=120;cv.height=130;const c=cv.getContext('2d',{willReadFrequently:true});
  for(const ch of PLK_L+PLK_D)for(const f of fonts){c.fillStyle='#fff';c.fillRect(0,0,120,130);c.fillStyle='#000';c.font=f;c.textAlign='center';c.textBaseline='alphabetic';c.fillText(ch,60,100);
    const d=c.getImageData(0,0,120,130).data,bits=new Uint8Array(120*130);for(let i=0;i<bits.length;i++)bits[i]=d[i*4]<128?1:0;const n=plkNorm(bits,120,130);if(n)PLK_T.push({ch,v:n.v,ar:n.ar})}
  return PLK_T}
function plkDist(a,b){let d=0;for(let i=0;i<560;i++)if(a[i]!==b[i])d++;return d}
function plakaLocal(src){
  const W0=Math.min(900,src.width),k=W0/src.width,w=W0,h=Math.max(8,Math.round(src.height*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d',{willReadFrequently:true});c.drawImage(src,0,0,w,h);
  const px=c.getImageData(0,0,w,h).data,g=new Float32Array(w*h);for(let i=0;i<w*h;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
  /* uyarlamalı eşik (integral görüntü) */
  const I=new Float64Array((w+1)*(h+1));for(let y=0;y<h;y++){let r=0;for(let x=0;x<w;x++){r+=g[y*w+x];I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+r}}
  const R=Math.max(10,Math.round(h/7)),bin=new Uint8Array(w*h);
  for(let y=0;y<h;y++){const y0=Math.max(0,y-R),y1=Math.min(h,y+R+1);for(let x=0;x<w;x++){const x0=Math.max(0,x-R),x1=Math.min(w,x+R+1);const s=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0],m=s/((x1-x0)*(y1-y0));bin[y*w+x]=g[y*w+x]<m*.8?1:0}}
  /* bağlı bileşenler */
  const lab=new Int32Array(w*h),comps=[],st=[];let nl=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=y*w+x;if(!bin[p]||lab[p])continue;nl++;lab[p]=nl;st.length=0;st.push(p);let x0=x,x1=x,y0=y,y1=y,a=0;
    while(st.length){const q=st.pop(),qx=q%w,qy=(q-qx)/w;a++;if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=qx+dx,ny=qy+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const n=ny*w+nx;if(bin[n]&&!lab[n]){lab[n]=nl;st.push(n)}}}
    comps.push({id:nl,x0,x1,y0,y1,w:x1-x0+1,h:y1-y0+1,a,cx:(x0+x1)/2,cy:(y0+y1)/2})}
  const cand=comps.filter(o=>o.h>=h*.06&&o.h<=h*.9&&o.w/o.h>=.1&&o.w/o.h<=2.4&&o.a>=30&&o.a/(o.w*o.h)>.18&&o.x0>0&&o.y0>0&&o.x1<w-1&&o.y1<h-1);
  let best=null;
  for(const r of cand){const grp=cand.filter(o=>Math.abs(o.h-r.h)<=r.h*.2&&Math.abs(o.cy-r.cy)<=r.h*.35).sort((a,b)=>a.cx-b.cx);
    /* yan yana, boşlukları makul olan en uzun koşu */
    let run=[],bestRun=[];for(const o of grp){if(run.length&&o.x0-run[run.length-1].x1>r.h*1.8){if(run.length>bestRun.length)bestRun=run;run=[]}run.push(o)}if(run.length>bestRun.length)bestRun=run;
    if(bestRun.length>=4&&bestRun.length<=9&&(!best||bestRun.length>best.g.length||(bestRun.length===best.g.length&&r.h>best.h)))best={g:bestRun,h:r.h}}
  if(!best)return{p:'',conf:0,dbg:{n:cand.length,cand:cand.map(o=>[o.x0,o.y0,o.w,o.h])}};
  /* birleşik (yapışık) harfleri ayır */
  const narrow=best.g.filter(o=>o.w/o.h<.95).map(o=>o.w).sort((x,y)=>x-y),mw=narrow.length?narrow[narrow.length>>1]:best.h*.6,segs=[];
  best.g.forEach(o=>{const k=o.w>mw*1.75&&o.w/o.h>.9?Math.min(3,Math.max(2,Math.round(o.w/mw))):1;if(k===1){segs.push([o,o.x0,o.x1]);return}
    const prof=new Array(o.w).fill(0);for(let y=o.y0;y<=o.y1;y++)for(let x=o.x0;x<=o.x1;x++)if(lab[y*w+x]===o.id)prof[x-o.x0]++;
    let a0=o.x0;for(let i=1;i<k;i++){const ex=o.w*i/k,lo=Math.max(1,Math.round(ex-o.w/k*.3)),hi=Math.min(o.w-2,Math.round(ex+o.w/k*.3));let bx=lo;for(let x=lo;x<=hi;x++)if(prof[x]<prof[bx])bx=x;segs.push([o,a0,o.x0+bx-1]);a0=o.x0+bx+1}segs.push([o,a0,o.x1])});
  const T=plkTemplates(),cs=segs.map(([o,xa,xb])=>{const ww=xb-xa+1,hh=o.h;if(ww<2)return null;const b=new Uint8Array(ww*hh);for(let y=0;y<hh;y++)for(let x=0;x<ww;x++)b[y*ww+x]=lab[(o.y0+y)*w+xa+x]===o.id?1:0;return plkNorm(b,ww,hh)});
  if(cs.some(x=>!x)||cs.length<5)return{p:'',conf:0};
  const cost=(c,set)=>{let bd=1e9,bc='';for(const t of T){if(!set.includes(t.ch))continue;const d=plkDist(c.v,t.v)+Math.abs(Math.log(c.ar/t.ar))*70;if(d<bd){bd=d;bc=t.ch}}return[bd,bc]};
  let res=null;const PEN=150;
  for(let i0=0;i0<cs.length;i0++)for(let i1=i0+5;i1<=Math.min(cs.length,i0+9);i1++){const sub=cs.slice(i0,i1),n=sub.length,drop=cs.length-n;
    for(let L=1;L<=3;L++){const D=n-2-L;if(D<2||D>4)continue;let tot=drop*PEN,out='';for(let i=0;i<n;i++){const [d,ch]=cost(sub[i],(i<2||i>=2+L)?PLK_D:PLK_L);tot+=d;out+=ch}
      const il=+out.slice(0,2);if(il<1||il>81)tot+=80;if(!res||tot<res.tot)res={tot,out,L,n}}}
  if(!res)return{p:'',conf:0};
  const avg=res.tot/res.n/560;return{p:res.out.slice(0,2)+' '+res.out.slice(2,2+res.L)+' '+res.out.slice(2+res.L),conf:Math.max(0,1-avg*4)}}

function loadScript(src,ms){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('yüklenemedi'));document.head.appendChild(s);setTimeout(()=>rej(new Error('zaman aşımı')),ms||20000)})}
let TESSW=null;
async function tessRead(cv){
  const base=window.__TESS_BASE;
  if(!window.Tesseract)await loadScript(base?base+'/tesseract.min.js':'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',25000);
  if(!TESSW){TESSW=await window.Tesseract.createWorker('eng',1,base?{workerPath:base+'/worker.min.js',corePath:base,langPath:base+'/lang'}:{});
    await TESSW.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPRSTUVYZ0123456789 ',tessedit_pageseg_mode:'11'})}
  const r=await TESSW.recognize(cv);return r.data.text||''}
async function plakaOkuImg(cv){
  if('TextDetector' in window){try{const r=await new window.TextDetector().detect(cv);const p=plakaParse(r.map(x=>x.rawValue).join(' '));if(p)return{p,by:'tarayıcı'}}catch(e){}}
  let loc=null;try{loc=plakaLocal(cv)}catch(e){}
  if(loc&&loc.p&&loc.conf>=.55)return{p:loc.p,by:'dahili'};
  try{if(!window.Tesseract)toast('Gelişmiş okuyucu yükleniyor, ilk seferde biraz sürebilir…');const p=plakaParse(await tessRead(cv));if(p)return{p,by:'ocr'}}catch(e){}
  if(loc&&loc.p)return{p:loc.p,by:'dahili',low:1};
  return{p:'',by:''}}
function fileToCanvas(file){return new Promise(res=>{const done=im=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv)};
  if(window.createImageBitmap){createImageBitmap(file,{imageOrientation:'from-image'}).then(done).catch(()=>res(null))}else{const im=new Image();im.onload=()=>done(im);im.onerror=()=>res(null);im.src=URL.createObjectURL(file)}})}

    const cv=await fileToCanvas(f);if(!cv){toast('Görsel açılamadı');return}

  inp.click()}
